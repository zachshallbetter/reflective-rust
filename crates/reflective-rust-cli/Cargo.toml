[package]
name = "reflective-rust-cli"
version = "0.2.0"
edition = "2024"
authors = ["Reflective Rust Research Team"]
description = "Command-line driver interface for inspecting static metadata, exporting CSG graphs, and extracting agent context slices."
license = "MIT OR Apache-2.0"

[dependencies]
reflective-rust-meta = { path = "../reflective-rust-meta", version = "0.2.0" }
reflective-rust-csg = { path = "../reflective-rust-csg", version = "0.2.0" }
reflective-rust-agent = { path = "../reflective-rust-agent", version = "0.2.0" }
reflective-rust-bench = { path = "../reflective-rust-bench", version = "0.2.0" }
reflective-rust-conformance = { path = "../reflective-rust-conformance", version = "0.2.0" }
serde_json = "1.0"
