[package]
name = "reflective-rust-derive"
version = "1.0.0"
edition = "2024"
authors = ["Reflective Rust Research Team"]
description = "Procedural macro prototype for #[derive(Reflectable)] generating opt-in zero-cost runtime descriptors."
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
reflective-rust-meta = { path = "../reflective-rust-meta", version = "1.0.0" }
