[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
reflective-rust-protocol = { path = "../reflective-rust-protocol", version = "0.2.0" }
serde_json.workspace = true
