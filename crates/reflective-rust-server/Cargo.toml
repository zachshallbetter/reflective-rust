[package]
name = "reflective-rust-server"
version = "1.0.0"
edition = "2024"
authors = ["Reflective Rust Research Team"]
description = "Out-of-process HTTP CSG query server and AI agent Graph RAG context endpoint."
license = "MIT OR Apache-2.0"

[dependencies]
reflective-rust-csg = { path = "../reflective-rust-csg", version = "1.0.0" }
reflective-rust-agent = { path = "../reflective-rust-agent", version = "1.0.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
