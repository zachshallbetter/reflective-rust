[package]
name = "reflective-rust-csg"
version = "1.0.0"
edition = "2024"
authors = ["Reflective Rust Research Team"]
description = "Compiler Semantic Graph (CSG) reference substrate and out-of-process query engine."
license = "MIT OR Apache-2.0"

[dependencies]
reflective-rust-meta = { path = "../reflective-rust-meta", version = "1.0.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
