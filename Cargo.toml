[workspace]
members = [
    "crates/reflective-rust-protocol",
    "crates/reflective-rust-meta",
    "crates/reflective-rust-csg",
    "crates/reflective-rust-derive",
    "crates/reflective-rust-agent",
    "crates/reflective-rust-server",
    "crates/reflective-rust-bench",
    "crates/reflective-rust-conformance",
    "crates/reflective-rust-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Reflective Rust Research Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zachshallbetter/reflective-rust"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2.2"
time = { version = "0.3", features = ["parsing", "formatting"] }
